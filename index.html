<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Photo Runner 3D</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="file-open-help" hidden>
      <strong>夜航跑道需要通过本地服务器打开</strong>
      <p>请在项目目录双击 <code>start-game.bat</code>，然后打开本机游戏地址。</p>
      <a href="http://localhost:5173/">打开本机游戏</a>
    </div>
    <style>
      #file-open-help { position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: min(88vw, 520px); padding: 28px; border: 1px solid #304652; border-radius: 16px; color: #f4f7f4; background: #071018; font: 16px/1.6 system-ui, sans-serif; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      #file-open-help[hidden] { display: none; }
      #file-open-help p { color: #abc0c2; }
      #file-open-help a { color: #071018; background: #ffb454; border-radius: 10px; display: inline-block; padding: 10px 14px; text-decoration: none; font-weight: 700; }
    </style>
    <script>
      if (location.protocol === "file:") document.getElementById("file-open-help").hidden = false;
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
